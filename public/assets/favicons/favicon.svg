<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <!-- FS Paving. O monograma "FS" recortado do logotipo, sobre o preto da marca.
       Vai embutido em base64 para este SVG ser autossuficiente e para o
       scripts/generate-favicons.mjs poder continuar a gerar os PNG a partir daqui. -->
  <rect width="64" height="64" rx="10" fill="#121110"/>
  <image x="0" y="0" width="64" height="64" xlink:href="data:image/png;base64,"/>
</svg>
